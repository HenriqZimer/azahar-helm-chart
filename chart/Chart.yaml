apiVersion: v2
name: azahar
description: A Helm chart for Azahar - the linuxserver.io 3DS emulator KasmVNC webtop image
type: application
version: 1.2.1
appVersion: "latest"
icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/azahar-logo.png
keywords:
  - azahar
  - emulator
  - 3ds
  - citra
  - retrogaming
  - kasmvnc
  - linuxserver
home: https://docs.linuxserver.io/images/docker-azahar/
sources:
  - https://github.com/linuxserver/docker-azahar
  - https://github.com/HenriqZimer/azahar-helm-chart
maintainers:
  - name: HenriqZimer
    email: henrique.zimermann@outlook.com
    url: https://henriqzimer.com.br
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/signKey: |
    fingerprint: C2E2E16693F2715BA0B23913BF94E5067859562F
    url: https://henriqzimer.github.io/azahar-helm-chart/HenriqZimer-helm-charts-public.asc
  artifacthub.io/links: |
    - name: Helm Repository
      url: https://henriqzimer.github.io/azahar-helm-chart/
    - name: Chart Source
      url: https://github.com/HenriqZimer/azahar-helm-chart
    - name: Maintainer Website
      url: https://henriqzimer.com.br
    - name: GitHub Profile
      url: https://github.com/HenriqZimer
    - name: linuxserver.io Azahar Image
      url: https://docs.linuxserver.io/images/docker-azahar/
    - name: Documentation
      url: https://github.com/HenriqZimer/azahar-helm-chart/blob/main/chart/README.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "sunshine.* now also mounts /dev/uhid - without it, Sunshine falls back to emulating gamepads as a generic Xbox One controller when the client reports a PlayStation-type pad (DualShock/DualSense), and that fallback does not correctly forward face buttons/triggers (confirmed: analog stick axes work, buttons don't) - the real virtual DualShock/DualSense device needs kernel uhid access to be created"
  artifacthub.io/changesHistory: |
    - version: 1.2.0
      changes:
        - kind: changed
          description: "BREAKING: sunshine.ports.* replaced by a single sunshine.port (Sunshine only accepts one configurable base port - every other port is a fixed offset from it, the old independent ports.* fields were silently ignored by Sunshine itself)"
    - version: 1.1.0
      changes:
        - kind: added
          description: sunshine.* (POC) - Sunshine/Moonlight low-latency game streaming as an alternative to the default Selkies/KasmVNC streaming, requiring a Docker Mod and hostNetwork/privileged - see CHANGELOG for the full rationale
    - version: 1.0.5
      changes:
        - kind: fixed
          description: README install commands now use a unique repo alias (<name>-helm-chart) instead of the bare chart name, and pin --version explicitly, matching what actually works
    - version: 1.0.4
      changes:
        - kind: changed
          description: README now shows the emulator's logo at the top (linuxserver.io's own image, same one used for the chart icon)
    - version: 1.0.3
      changes:
        - kind: added
          description: Chart releases are now signed (helm package --sign) - see artifacthub.io/signKey for the public key location and fingerprint, powers the "Signed" badge on ArtifactHub
    - version: 1.0.2
      changes:
        - kind: added
          description: values.schema.json - validates values.yaml against a JSON Schema, and is what powers the "Values schema" feature/badge on ArtifactHub (previously absent)
    - version: 1.0.1
      changes:
        - kind: added
          description: icon, previously missing entirely - pointed at linuxserver.io's own logo image for this app, which is why no image was ever showing on ArtifactHub
    - version: 1.0.0
      changes:
        - kind: added
          description: Initial release of the Azahar Helm chart
        - kind: added
          description: GPU passthrough for both Intel/AMD (VA-API via /dev/dri) and NVIDIA (via the NVIDIA Kubernetes device plugin, gpu.vendor=nvidia)
        - kind: added
          description: seccompUnconfined and a 2Gi default shmSize, both carried over from this chart's sibling pcsx2-helm-chart after PCSX2's JIT recompiler was found to crash with SIGBUS under Docker/Kubernetes' default seccomp/shm limits - not independently confirmed on Azahar, but the same base image/toolchain makes it a likely fix if you hit the same crash
        - kind: added
          description: streaming.enabled/streaming.brokerPort in values.yaml, kept only so the chart's shape matches its siblings. WARNING - no RomM broker mod exists for Azahar at all - unlike PCSX2/Dolphin/xemu/Eden/RPCS3/PPSSPP there isn't even a placeholder repo, azahar-romm-integration does not exist anywhere on GitHub - there is nothing to enable yet
