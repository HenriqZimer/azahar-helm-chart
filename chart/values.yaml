# -- Number of replicas. KasmVNC/webtop images keep session state in
# /config, so this should stay at 1 (no session affinity/clustering).
replicaCount: 1

# -- Number of old ReplicaSets to retain for rollback history.
revisionHistoryLimit: 3

# -- Image pull secrets to authenticate with private repositories.
imagePullSecrets: []

# -- Override the default name of the chart.
nameOverride: ""
# -- Override the default full name of the chart.
fullnameOverride: ""

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Additional labels to add to the pod.
podLabels: {}

# -- ServiceAccount configuration.
serviceAccount:
  # -- Specifies whether a ServiceAccount should be created.
  create: false
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount to use. If not set and create is true, a
  # name is generated using the fullname template. If create is false,
  # defaults to "default".
  name: ""

image:
  # -- linuxserver.io Azahar image repository.
  repository: lscr.io/linuxserver/azahar
  # -- Image tag. "latest" tracks linuxserver's rolling release.
  tag: "latest"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

env:
  # -- User ID the app runs as inside the container. Match this to the
  # owner of the /config volume to avoid permission issues.
  PUID: "1000"
  # -- Group ID the app runs as inside the container.
  PGID: "1000"
  # -- Timezone, e.g. "America/Sao_Paulo".
  TZ: "Etc/UTC"
  # -- Title shown in the browser tab of the KasmVNC session.
  TITLE: "Azahar"
  # -- Set to "true" to require CUSTOM_USER/PASSWORD basic auth on the
  # web UI. Leave "false" if access is already restricted (e.g. via
  # ingress auth, VPN, or NetworkPolicy).
  KASMVNC_ENABLE_BASIC_AUTH: "false"
  # -- Basic auth username, only used when KASMVNC_ENABLE_BASIC_AUTH=true.
  CUSTOM_USER: ""
  # -- Basic auth password, only used when KASMVNC_ENABLE_BASIC_AUTH=true.
  # Prefer envFrom/extraEnv with a Secret over setting this in plaintext.
  PASSWORD: ""

# -- Extra environment variables, in raw Kubernetes `env` entry form
# (supports valueFrom). Merged after the `env` map above.
extraEnv: []
# - name: SOME_VAR
#   valueFrom:
#     secretKeyRef:
#       name: some-secret
#       key: some-key

# -- Extra envFrom sources (ConfigMaps/Secrets), raw Kubernetes form.
envFrom: []

service:
  # -- Service type (ClusterIP, NodePort, or LoadBalancer).
  type: ClusterIP
  # -- KasmVNC HTTP port (plain, no TLS).
  httpPort: 3000
  # -- KasmVNC HTTPS port (self-signed cert generated by the image).
  httpsPort: 3001
  # -- Annotations for the Service.
  annotations: {}
  # -- Labels for the Service.
  labels: {}

ingress:
  # -- Enable an Ingress in front of the http (3000) port.
  enabled: false
  # -- IngressClass name.
  className: "traefik"
  # -- Extra annotations for the Ingress.
  annotations: {}
  hosts:
    - host: azahar.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Persistence for /config (app settings, BIOS, saves, and — unless you
# use extraVolumes below for a separate library — the ROMs themselves).
persistence:
  config:
    enabled: false
    # -- One of: pvc, hostPath, emptyDir.
    type: pvc
    hostPath: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
    storageClass: ""
    existingClaim: ""

# -- Extra volumes, raw Kubernetes `volumes` entries. Use this to mount an
# existing ROMs/BIOS library (e.g. an NFS-backed PVC also used by other
# emulator charts) without redefining PVC lifecycle here.
extraVolumes: []
# - name: roms
#   persistentVolumeClaim:
#     claimName: romm-library-truenas

# -- Extra volume mounts, raw Kubernetes `volumeMounts` entries. Paired
# with extraVolumes above.
extraVolumeMounts: []
# - name: roms
#   mountPath: /roms
#   readOnly: true

# -- Size of the /dev/shm mount. KasmVNC/browser-based rendering is prone
# to crashing on the small default shm size, so this is mounted as a
# memory-backed emptyDir. Azahar's PPU/SPU JIT recompilers (ASMJIT-based)
# use similar shared-memory-backed "fastmem" tricks to PCSX2's EE
# recompiler, which crashes with SIGBUS under Docker/Kubernetes' tiny
# default shm right as a game starts (confirmed on this chart's sibling,
# pcsx2-helm-chart - not independently confirmed on Azahar itself, but the
# same base image/toolchain makes it likely). 2Gi matches the value that
# fixed it for PCSX2; raise it further if you see SIGBUS in the container
# logs after a game launch.
shmSize: 2Gi

# -- RomM emulator-streaming broker port. This chart does not install the
# broker itself - on the sibling PCSX2/Dolphin/xemu/Eden/RPCS3 charts it's
# added via a Docker Mod (`env.DOCKER_MODS`). NO SUCH MOD EXISTS FOR Azahar -
# unlike the other siblings, there isn't even a placeholder repo:
# azahar-romm-integration does not exist anywhere on GitHub. There is no
# image to point `env.DOCKER_MODS` at. This block is kept only so the
# chart's shape matches its siblings and is ready if that changes; leave
# `enabled: false` for now.
# See https://docs.romm.app/latest/using/emulator-streaming/
streaming:
  # -- Expose the broker port on the container and Service. Leave false -
  # no broker exists yet for Azahar, see above.
  enabled: false
  # -- Port the broker HTTP API would listen on, if a mod ever ships.
  brokerPort: 8000

# -- Sunshine/Moonlight low-latency game streaming - POC alternative to
# the default Selkies/KasmVNC streaming (see streaming above, a different
# feature). Pair with a Docker Mod that installs Sunshine (via the
# LizardByte pacman repo - this image is Arch Linux, not Debian) and
# swaps the base image's Xvfb for a real Xorg + "dummy" driver - Xvfb in
# this image is not linked against libudev, so it never hotplugs the
# mouse/keyboard/gamepad devices Sunshine creates via /dev/uinput
# (confirmed by testing: video/pairing work either way, but input
# silently does nothing without the Xorg swap). Also requires
# PIXELFLUX_WAYLAND=false in env (the image defaults to a Wayland
# compositor, which Sunshine can't capture) and DOCKER_MODS pointing at
# the mod image (ghcr.io/henriqzimer/azahar-sunshine-mod).
sunshine:
  enabled: false
  # -- hostNetwork is required for two reasons, both confirmed in testing:
  # (1) Moonlight talks raw TCP+UDP on fixed ports - no HTTP, so it can't
  # go through the Traefik Ingress like the streaming/web UI ports do; (2)
  # the pod needs to share the node's network namespace for the kernel's
  # uinput hotplug uevents (broadcast over netlink) to actually reach the
  # udev daemon running inside the container - without it, the virtual
  # input devices Sunshine creates are invisible to Xorg no matter what
  # else is configured correctly.
  # -- Kept as an available fallback, but the DEFAULT exposure method is
  # `service.enabled` below (a dedicated LoadBalancer Service via MetalLB),
  # not hostNetwork. Confirmed in production (2026-08-23): with multiple
  # sunshine-enabled emulators sharing one GPU node, hostNetwork makes them
  # all share the node's real network stack - the base image's KasmVNC
  # nginx binds 3000/3001 HARDCODED (ignores service.httpPort), so only the
  # first pod to start wins those ports and every other pod loops
  # "Address already in use" forever, losing browser/RomM access entirely.
  # LoadBalancer keeps each pod in its own network namespace, so this
  # collision cannot happen regardless of how many emulators share a node.
  hostNetwork: false
  # -- Kubernetes has no native knob for a custom device cgroup rule (the
  # POC needed `c 13:* rmw` - the whole "input" major - for the pod to be
  # allowed to open the /dev/input/eventN nodes Sunshine's uinput calls
  # create at runtime, since only /dev/uinput itself is in the default
  # device allowlist). `privileged: true` is the bluntest way to get that
  # on plain Kubernetes; see the chart README for the security tradeoff.
  privileged: true
  # -- Sunshine only accepts ONE configurable port (the "port" setting in
  # sunshine.conf, default 47989 = "http") - every other port it listens
  # on (https, web UI, rtsp, video, control, audio, mic) is a FIXED offset
  # from this base (confirmed against Sunshine's source, net::map_port()
  # does `base + offset`; offsets below reverse-engineered from the
  # default port set: https=-5, web=+1, video=+9, control=+10, audio=+11,
  # mic=+13, rtsp=+21). Change this if running two Sunshine-enabled
  # emulators with hostNetwork on the SAME node - they share an IP, so
  # their base ports can't collide.
  port: 47989

  # -- Dedicated LoadBalancer Service (MetalLB) for the Moonlight TCP/UDP
  # ports - the default exposure method now that hostNetwork above is off.
  # Multiple emulator releases are meant to SHARE one external IP (the
  # MetalLB pool is small) by setting the same loadBalancerIP + sharedIPKey
  # on all of them and relying on each having a unique `port` above (see
  # https://metallb.universe.tf/usage/#ip-address-sharing) - MetalLB allows
  # this as long as the port sets never overlap between Services.
  service:
    enabled: true
    # -- MetalLB address to request (leave empty to let MetalLB
    # auto-assign one from the pool instead - fine for a single emulator,
    # but auto-assign will NOT reliably reuse the same IP for shared-IP
    # setups, so pin this explicitly when multiple releases share one IP).
    loadBalancerIP: ""
    # -- metallb.io/allow-shared-ip annotation value. Set the SAME string
    # on every release that should share loadBalancerIP above; leave empty
    # to not request IP sharing (MetalLB then needs a free address of its
    # own for this Service).
    sharedIPKey: ""
    # -- MUST be Cluster, not Local, when multiple emulators share one IP
    # (sharedIPKey set): MetalLB's IP-sharing with Local traffic policy
    # requires every Service sharing that IP to have an IDENTICAL pod
    # selector (see https://metallb.universe.tf/usage/#ip-address-sharing) -
    # our 9 emulators are 9 different Deployments/selectors, so Local always
    # fails allocation ("can't change sharing key") no matter how the
    # annotation/ports are set up (confirmed in production, 2026-08-23).
    # Cluster does not have that same-selector requirement. The tradeoff
    # (extra kube-proxy hop, loses the real client source IP) is minor here.
    externalTrafficPolicy: Cluster
    annotations: {}

# -- GPU/hardware acceleration passthrough.
gpu:
  enabled: false
  # -- GPU backend: "intel-amd" (VA-API via a /dev/dri hostPath mount) or
  # "nvidia" (via the NVIDIA Kubernetes device plugin - requires the
  # plugin's DaemonSet already installed on the cluster/node).
  vendor: intel-amd

  # -- Host device path to mount into the container. Only used when
  # vendor is "intel-amd".
  devicePath: /dev/dri
  # -- Supplemental group IDs to add to the container so it can access
  # the device node (typically the host's "render" and/or "video" group
  # GID, check with `getent group render video` on the node). Only used
  # when vendor is "intel-amd" - the NVIDIA device plugin handles device
  # permissions itself, no group membership needed.
  supplementalGroups: []

  # -- Only used when vendor is "nvidia".
  nvidia:
    # -- Number of GPUs to request via the `nvidia.com/gpu` resource limit.
    count: 1
    # -- NVIDIA_DRIVER_CAPABILITIES value forwarded to the container.
    # "all" is the safest default - Azahar/Selkies need both "graphics" (EGL/
    # GBM, the compositor) and "video"/"compute" (NVENC, CUDA), and trimming
    # this down has caused more breakage than it saved in testing (see
    # CHANGELOG for the shmSize/seccomp fixes this chart also carries).
    driverCapabilities: all

# -- Azahar's PPU/SPU JIT recompilers can crash under Docker/Kubernetes'
# default seccomp profile on some kernel/libseccomp combinations (it
# blocks syscalls JIT compilers need to allocate executable memory) - see
# the "Strict reverse proxies"/security section of
# https://docs.linuxserver.io/images/docker-azahar/. Only disable this if
# you actually hit a crash tied to that (check the container logs for
# "Unhandled SIGBUS"/"SIGSEGV" right after boot) - it removes a real
# security boundary.
seccompUnconfined: false

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# -- Security context for the pod.
podSecurityContext: {}

# -- Security context for the container. linuxserver images expect to
# start as root and drop privileges internally via s6-overlay/PUID/PGID,
# so this is left empty by default.
securityContext: {}

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}

probes:
  # -- Desliga a readiness/liveness probe (porta http/3000 do Selkies).
  # Precisa ficar false quando dois pods com sunshine.hostNetwork rodam
  # no mesmo node: o nginx do Selkies escuta em 3000/3001 hardcoded (nao
  # respeita service.httpPort), entao o segundo pod nunca consegue
  # bindar essa porta - sem desligar a probe, o kubelet mata o container
  # em crashloop mesmo com o Sunshine funcionando normalmente. A UI web
  # do Azahar fica inacessivel nesse cenario, so o Moonlight funciona.
  enabled: true
